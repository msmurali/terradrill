<div class="answer-panel">
  <span class="answer-panel-tag"
    >{{ gameService.gameMode()?.mode === gameModes.WORLD_MAP ? 'World Map' : 'Flag' }} Quiz</span
  >
  <h1 class="answer-panel-question">
    {{
      gameService.gameMode()?.mode === gameModes.WORLD_MAP
        ? 'Which country is highlighted?'
        : 'Which country flies this flag?'
    }}
  </h1>
  @if (gameService.answerMode()?.mode === answerModes.VOICE) {
    <app-voice></app-voice>
  } @else {
    <app-quiz
      [target]="gameService.targetCountry()"
      [options]="gameService.options()"
      (quizAnswered)="onQuizAnswered($event)"
    />
  }

  <button class="skip-button" (click)="gameService.skipRound()" [disabled]="gameService.freeze()">
    <span>Skip round &nbsp;</span>
    <svg
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <line x1="5" y1="12" x2="19" y2="12"></line>
      <polyline points="12 5 19 12 12 19"></polyline>
    </svg>
  </button>
</div>
