<div class="quiz">
  <span class="quiz-tag"
    >{{ gameService.gameMode()?.mode === gameModes.WORLD_MAP ? 'World Map' : 'Flag' }} Quiz</span
  >
  <h1 class="quiz-question">
    {{
      gameService.gameMode()?.mode === gameModes.WORLD_MAP
        ? 'Which country is highlighted?'
        : 'Which country flies this flag?'
    }}
  </h1>
  <ul class="quiz-options">
    @for (option of options(); track option.code) {
      <li
        class="quiz-option"
        (click)="onAnswer($event, option)"
        [class.valid]="answered() && target()?.code === option?.code"
        [class.invalid]="
          answered() && option.code === answer()?.code && answer()?.code !== target()?.code
        "
        [class.froozen]="answered() && gameService.freeze()"
      >
        {{ option.name }}
      </li>
    }
  </ul>
  <button
    class="skip-button"
    (click)="gameService.skipRound()"
    [disabled]="answered() && gameService.freeze()"
  >
    <span>Skip round &nbsp;</span>
    <svg
      data-dc-tpl="99"
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      data-om-id="9bc21eed:102"
    >
      <line data-dc-tpl="100" x1="5" y1="12" x2="19" y2="12" data-om-id="9bc21eed:103"></line>
      <polyline data-dc-tpl="101" points="12 5 19 12 12 19" data-om-id="9bc21eed:104"></polyline>
    </svg>
  </button>
</div>
