<div class="quiz">
  <h1 class="quiz-question">Which country flies this flag?</h1>
  <ul class="quiz-options">
    @for (option of options(); track option.code) {
      <li
        class="quiz-option"
        (click)="onAnswer($event, option)"
        [class.valid]="answered() && target()?.code === option?.code"
        [class.invalid]="
          answered() && option.code === answer()?.code && answer()?.code !== target()?.code
        "
        [class.froozen]="answered() && gameService.freeze() && answer()?.code !== target()?.code"
      >
        {{ option.name }}
      </li>
    }
  </ul>
  <button class="skip-button" (click)="gameService.skipRound()">SKIP ROUND</button>
</div>
