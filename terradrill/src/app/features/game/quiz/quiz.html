<div class="quiz">
  <ul class="quiz-options">
    @for (option of options(); track option.code) {
      <li
        class="quiz-option"
        (click)="onAnswer($event, option)"
        [class.valid]="answered() && target()?.code === option?.code"
        [class.invalid]="
          answered() && option.code === answer()?.code && answer()?.code !== target()?.code
        "
        [class.froozen]="answered() && gameService.freeze()"
      >
        {{ option.name }}
      </li>
    }
  </ul>
</div>
